# Reproducible demo of the control plane (API + console). Not required for
# local development — ./start.sh / ./start.ps1 remain the primary path and
# keep working unchanged. GPU training stays on the host venv; this image
# never ships torch/CUDA (see Dockerfile).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      BISCUITS_AUTH_MODE: ${BISCUITS_AUTH_MODE:-login}
      BISCUITS_PROXY_SECRET: ${BISCUITS_PROXY_SECRET:-}
    volumes:
      - ./projects:/app/projects
      - ./.enterprise:/app/.enterprise
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
