# Base model swap: Mistral-7B-Instruct instead of Llama-3.2-1B-Instruct.
# Reason (see conversation): the 1B model could not produce fluent, sensible
# "tip" text no matter the epochs/decoding tuned — a capacity ceiling, not a
# hyperparameter problem. Mistral-7B is much more fluent natively, even
# before fine-tuning, so it should need less LoRA "reshaping" to sound human.
#
# r=8 kept (was the best-performing rank in every 1B sweep) as the starting
# point — re-sweep r16/r32 once this is validated, same as the 1B configs.
#
# VRAM: 8GB card. 4-bit QLoRA base (~4GB) + LoRA/activations for a 32-layer,
# 4096-hidden model is tighter than the 1B run (~2.5GB peak) — gradient
# checkpointing is enabled here as a precaution (see training/scripts/train.py).

experiment:
  id: experiment_mistral_r8
  notes: "base model swap: Mistral-7B-Instruct-v0.3, r=8, gradient checkpointing on for VRAM headroom"

model:
  name: mistralai/Mistral-7B-Instruct-v0.3
  ollama_equivalent: mistral:7b-instruct-v0.3-q4_K_M

dataset:
  version: dataset-v0.8
  train_path: data/train
  validation_path: data/validation
  max_seq_length: 1024

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

training:
  seed: 42
  epochs: 3  # start conservative (1B needed 6, but Mistral is far more capable pretrained — likely needs less reshaping to learn the JSON/behavior pattern)
  learning_rate: 0.0002
  batch_size: 1
  gradient_accumulation_steps: 8
  warmup_steps: 5
  logging_steps: 10
  save_steps: 50
  eval_strategy: steps
  eval_steps: 50
  gradient_checkpointing: true
  output_dir: models/adapters/experiment_mistral_r8

