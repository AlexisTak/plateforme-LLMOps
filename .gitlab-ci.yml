# GitLab CI/CD — mirrors .github/workflows/ci.yml so both hosts run the same gates.
#
# Stages:
#   lint  → ruff (Python), eslint + tsc (web)      fast feedback
#   test  → pytest -m "not gpu", vitest            no GPU/HF downloads in CI
#   build → next build; docker images on main/tags  proves the deployable artefacts
#
# The GPU-marked tests (tests/test_rag_injection.py) are deliberately excluded:
# they need CUDA and a 1B model download. Run them manually with `pytest -m gpu`.

stages: [lint, test, build]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  BISCUITS_AUTH_MODE: "local"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    # Avoid duplicate pipelines: branch pushes with an open MR run as MR pipelines only.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Python

.python:
  image: python:3.11-slim
  cache:
    key:
      files: [requirements.txt]
    paths: [.cache/pip]
  before_script:
    - python -m pip install --upgrade pip
    # CPU wheels only — the CUDA index is never used in CI.
    - pip install torch --index-url https://download.pytorch.org/whl/cpu
    - pip install -r requirements.txt ruff

lint:python:
  extends: .python
  stage: lint
  script:
    - ruff check .

test:python:
  extends: .python
  stage: test
  needs: ["lint:python"]
  script:
    - python -m pytest -m "not gpu" -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

# ---------------------------------------------------------------------------
# Web

.web:
  image: node:22-slim
  cache:
    key:
      files: [web/package-lock.json]
    paths: [.cache/npm]
  before_script:
    - cd web
    - npm ci

lint:web:
  extends: .web
  stage: lint
  script:
    - npm run lint
    - npm run typecheck

test:web:
  extends: .web
  stage: test
  needs: ["lint:web"]
  script:
    - npm test

build:web:
  extends: .web
  stage: build
  needs: ["test:web"]
  variables:
    NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"
  script:
    - npm run build

# ---------------------------------------------------------------------------
# Docker images (main + tags only): pushed to the project's GitLab registry

.docker:
  image: docker:27
  services: [docker:27-dind]
  stage: build
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:image:api:
  extends: .docker
  needs: ["test:python"]
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/api:latest" .
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/api:latest"

build:image:web:
  extends: .docker
  needs: ["build:web"]
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/web:latest" web
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/web:latest"
