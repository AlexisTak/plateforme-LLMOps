[project]
name = "biscuits-focus"
version = "0.1.0"
description = "Local platform for creating, fine-tuning and evaluating specialized language models."
requires-python = ">=3.11,<3.12"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "gpu" marks tests that load the 1B model in 4-bit: they need a CUDA device and
# take minutes. Jenkins runs `-m "not gpu"` on every build and `-m gpu` only when
# the RUN_GPU_TESTS parameter is set, so a plain build stays fast and doesn't
# need a GPU agent.
markers = [
    "gpu: requires a CUDA device and loads a model (slow)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
