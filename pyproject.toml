[project]
name = "biscuits-focus"
version = "0.1.0"
description = "Local platform for creating, fine-tuning and evaluating specialized language models."
requires-python = ">=3.11,<3.12"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "gpu" marks tests that load the 1B model in 4-bit: they need a CUDA device and
# take minutes. Jenkins runs `-m "not gpu"` on every build and `-m gpu` only when
# the RUN_GPU_TESTS parameter is set, so a plain build stays fast and doesn't
# need a GPU agent.
markers = [
    "gpu: requires a CUDA device and loads a model (slow)",
]

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = [".venv", "web", "projects", "docs"]

[tool.ruff.lint]
# Correctness-oriented set only (no style churn on an existing codebase):
# pyflakes, pycodestyle errors, bugbear, pyupgrade, unused args on defs kept out.
select = ["E", "F", "B", "UP", "I"]
ignore = [
    "E501",  # line length is advisory; long f-strings/SQL are common here
    "B008",  # `project: Path = Depends(project_dir)` is the FastAPI idiom
    "E402",  # scripts/ and inference/ insert ROOT into sys.path before importing
    "B904",  # pre-existing `raise HTTPException(...)` inside except without `from`; tracked in AUDIT.md
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False in tests is fine

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
