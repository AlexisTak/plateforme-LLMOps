# Higher-capacity LoRA config (r=32) — more capacity, more VRAM/adapter size.
# Compare against lora_r8.yaml / lora_r16.yaml on: quality, VRAM, time, adapter size, stability.
# See docs/ENVIRONMENT.md for hardware constraints (RTX 4060, 8GB VRAM).
# alpha kept at 2*r so effective scaling (alpha/r) matches the other variants.

experiment:
  id: experiment_003
  notes: r=32, higher capacity, watch VRAM headroom on 8GB card and overfitting on small dataset

model:
  name: unsloth/Llama-3.2-1B-Instruct
  ollama_equivalent: llama3.2:1b

dataset:
  version: dataset-v0.4
  train_path: data/train
  validation_path: data/validation
  max_seq_length: 1024

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

training:
  seed: 42
  epochs: 2
  learning_rate: 0.0002
  batch_size: 1
  gradient_accumulation_steps: 8
  warmup_steps: 5
  logging_steps: 10
  save_steps: 50
  eval_strategy: steps
  eval_steps: 50
  output_dir: models/adapters/experiment_003

