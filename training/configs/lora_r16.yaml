# Baseline LoRA config (r=16) — starting point, not a final answer.
# Compare against lora_r8.yaml / lora_r32.yaml on: quality, VRAM, time, adapter size, stability.
# See docs/ENVIRONMENT.md for hardware constraints (RTX 4060, 8GB VRAM).
# alpha is kept at 2*r across all three variants so effective LoRA scaling (alpha/r) stays
# constant — the comparison isolates rank capacity, not scaling strength.

experiment:
  id: experiment_001
  notes: baseline r=16

model:
  # Ungated HF mirror of meta-llama/Llama-3.2-1B-Instruct (same weights, no license gate).
  name: unsloth/Llama-3.2-1B-Instruct
  ollama_equivalent: llama3.2:1b

dataset:
  version: dataset-v0.4
  train_path: data/train
  validation_path: data/validation
  max_seq_length: 1024  # revisit after tokenization length analysis (scripts/analyze_dataset.py)

quantization:
  # QLoRA: load base in 4-bit NF4, train LoRA adapters in bf16 on top.
  # Confirmed working on this GPU (compute cap 8.9) — see docs/ENVIRONMENT.md.
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # Real module names from LlamaForCausalLM (transformers AutoConfig inspection,
  # see docs/ENVIRONMENT.md) — attention + MLP projections, not guessed.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

training:
  seed: 42
  epochs: 2
  learning_rate: 0.0002
  batch_size: 1
  gradient_accumulation_steps: 8
  warmup_steps: 5  # dataset is tiny right now; revisit once dataset-v0.2+ has real volume
  logging_steps: 10
  save_steps: 50
  eval_strategy: steps
  eval_steps: 50
  output_dir: models/adapters/experiment_001

